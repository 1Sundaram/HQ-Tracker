<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HQ Elite Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#060816;
    --card:#11182d;
    --card2:#17213d;
    --glass:rgba(255,255,255,0.05);
    --border:rgba(255,255,255,0.08);

    --primary:#7c5cff;
    --primary2:#00d4ff;
    --success:#35f59d;
    --danger:#ff2b4e;
    --text:#f3f6ff;
    --muted:#95a3c7;

    --shadow:0 10px 40px rgba(0,0,0,0.45);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:
        radial-gradient(circle at top left, rgba(124,92,255,0.18), transparent 25%),
        radial-gradient(circle at top right, rgba(0,212,255,0.14), transparent 20%),
        linear-gradient(145deg,#050816,#0b1020 60%, #10182d);
    color:var(--text);
    min-height:100vh;
    padding:22px;
}

.container{
    max-width:1600px;
    margin:auto;
}

.hero{
    background:linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border:1px solid var(--border);
    backdrop-filter: blur(14px);
    border-radius:28px;
    padding:28px;
    box-shadow:var(--shadow);
    margin-bottom:28px;
}

.hero-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.hero h1{
    font-size:3rem;
    font-weight:800;
    background:linear-gradient(90deg,var(--primary),var(--primary2));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    color:var(--muted);
    margin-top:8px;
}

.month-switcher{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.month-btn{
    border:none;
    padding:14px 22px;
    border-radius:14px;
    cursor:pointer;
    color:white;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.08);
    font-weight:700;
    transition:0.25s ease;
}

.month-btn.active{
    background:linear-gradient(135deg,#fa0d8b,#fa82be,#ff00aa); box-shadow:0 0 18px rgba(255,20,147,0.65);
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(124,92,255,0.35);
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
    margin-top:28px;
}

.stat-card{
    background:linear-gradient(145deg,var(--card),var(--card2));
    border:1px solid var(--border);
    border-radius:22px;
    padding:24px;
    position:relative;
    overflow:hidden;
}

.stat-card::before{
    content:'';
    position:absolute;
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(124,92,255,0.15);
    right:-40px;
    top:-40px;
}

.stat-label{
    color:var(--muted);
    font-size:0.92rem;
    margin-bottom:14px;
    position:relative;
    z-index:2;
}

.stat-value{
    font-size:2.4rem;
    font-weight:800;
    position:relative;
    z-index:2;
}

.min-color{ color:#75b7ff; }
.max-color{ color:#4dffb8; }
.total-color{ color:#ffdb70; }

.layout{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
    gap:22px;
}

.panel{
    background:linear-gradient(145deg,rgba(18,25,46,0.98),rgba(12,17,31,0.95));
    border:1px solid var(--border);
    border-radius:24px;
    padding:24px;
    box-shadow:var(--shadow);
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
}

.panel-title{
    font-size:1.25rem;
    font-weight:700;
}

.badge{
    background:rgba(124,92,255,0.18);
    color:#b7abff;
    padding:8px 12px;
    border-radius:999px;
    font-size:0.78rem;
    border:1px solid rgba(124,92,255,0.25);
}

.task-list{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.task-item{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.05);
    border-radius:18px;
    padding:16px;
    display:flex;
    justify-content:space-between;
    gap:14px;
    align-items:center;
    transition:0.25s ease;
}

.task-item:hover{
    transform:translateY(-2px);
    border-color:rgba(124,92,255,0.35);
}

.task-name{
    font-weight:700;
    margin-bottom:6px;
}

.task-points{
    color:var(--muted);
    font-size:0.9rem;
}

.task-points span{
    color:var(--success);
    font-weight:700;
}

.checkbox-wrapper{
    position:relative;
    width:30px;
    height:30px;
    min-width:30px;
    cursor:pointer;
}

.checkbox-wrapper input{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
}

.checkmark{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    border:2px solid rgba(255,255,255,0.12);
    transition:0.2s ease;
}

.checkbox-wrapper input:checked + .checkmark{
    background:linear-gradient(135deg,#ff1493,#ff69b4,#ff00aa);
    border-color:#ff7ebe;
}

.checkmark::after{
    content:'';
    position:absolute;
    left:8px;
    top:2.5px;
    width:7px;
    height:14px;
    border:solid rgb(238, 0, 59);
    border-width:0 3px 3px 0;
    transform:rotate(45deg);
    opacity:0;
}

.checkbox-wrapper input:checked + .checkmark::after{
    opacity:1;
}

.weekly-checks{
    display:flex;
    gap:10px;
}

.week-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
}

.week-box small{
    color:var(--muted);
}

.daily-box{
    background:rgba(255,255,255,0.03);
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
}

.daily-head{
    display:flex;
    justify-content:space-between;
    margin-bottom:16px;
    color:var(--muted);
    font-size:0.92rem;
}

.daily-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.daily-item{
    background:rgba(0,0,0,0.25);
    border-radius:14px;
    padding:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
}

.footer-actions{
    margin-top:26px;
    display:flex;
    justify-content:center;
}

.reset-btn{
    border:none;
    padding:14px 22px;
    border-radius:14px;
    background:linear-gradient(135deg,#ff5470,#ff7b5c);
    color:white;
    font-weight:700;
    cursor:pointer;
    transition:0.25s ease;
}

.reset-btn:hover{
    transform:translateY(-2px) scale(1.02);
}

@media(max-width:768px){
    .hero h1{
        font-size:2.2rem;
    }

    .daily-grid{
        grid-template-columns:repeat(5,1fr);
    }

    .layout{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <section class="hero">
        <div class="hero-top">
            <div>
                <h1>⚡ HQ Elite Tracker</h1>
                <p>Advanced 2-Month Activity & Point Tracking Dashboard</p>
            </div>

            <div class="month-switcher">
                <button class="month-btn active" onclick="switchMonth(0)">Month 1</button>
                <button class="month-btn" onclick="switchMonth(1)">Month 2</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Current Month Minimum</div>
                <div class="stat-value min-color" id="month-min">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Current Month Maximum</div>
                <div class="stat-value max-color" id="month-max">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Total Minimum</div>
                <div class="stat-value total-color" id="overall-min">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Total Maximum</div>
                <div class="stat-value total-color" id="overall-max">0</div>
            </div>

        </div>
    </section>

    <section class="layout">

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">📅 Monthly Tasks</div>
                <div class="badge">1x / Month</div>
            </div>

            <div class="task-list" id="monthly-list"></div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">📆 Monday Tasks</div>
                <div class="badge">4 Weeks</div>
            </div>

            <div class="task-list" id="monday-list"></div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">⚡ Daily Tasks</div>
                <div class="badge">Live Progress</div>
            </div>

            <div class="daily-box">
                <div class="daily-head">
                    <span>Report Bug (25 pts)</span>
                    <span id="bug-count">0/10</span>
                </div>

                <div class="daily-grid" id="bug-grid"></div>
            </div>

            <div class="daily-box">
                <div class="daily-head">
                    <span>Share Web3 Journey (1-30 pts)</span>
                    <span id="journey-count">0/5</span>
                </div>

                <div class="daily-grid" id="journey-grid"></div>
            </div>
        </div>

    </section>

    <div class="footer-actions" style="gap:14px; flex-wrap:wrap;">
        <button class="reset-btn" onclick="resetMonth(0)">Reset Month 1</button>
        <button class="reset-btn" onclick="resetMonth(1)">Reset Month 2</button>
        <button class="reset-btn" onclick="resetAll()">Reset Both Months</button>
    </div>

</div>

<script>
const tasks = {
    monthly:[
        { id:'m1', name:'Technical Blog (HQ Forum)', min:10, max:50 },
        { id:'m2', name:'Share Project on Twitter', min:10, max:50 },
        { id:'m3', name:'Craft Insightful Web3 Threads', min:1, max:30 },
        { id:'m4', name:'Refer Friend (HQ Believer)', min:20, max:20 },
        { id:'m5', name:'Submit Project (Monthly Builder Trial)', min:75, max:75 },
        { id:'m6', name:'Report Wins/Grants', min:50, max:50 },
        { id:'m7', name:'Write Detailed Blog Post', min:25, max:75 },
        { id:'m8', name:'Refer Friend (Co-Learning Camp)', min:25, max:25 }
    ],

    monday:[
        { id:'w1', name:'Attend Weekly Connect', min:25, max:25 },
        { id:'w2', name:'Weekly Connect Tweet', min:10, max:30 },
        { id:'w3', name:'Create & Post Memes', min:20, max:20 },
        { id:'w4', name:'Short Video (60-90s)', min:10, max:50 },
        { id:'w5', name:'Tutorial Video (10-15m)', min:25, max:75 },
        { id:'w6', name:'Info Video (2-5m)', min:20, max:60 }
    ],

    daily:{
        bugs:{count:10, min:25, max:25},
        journey:{count:5, min:1, max:30}
    }
};

let activeMonth = 0;

let state = {
    months:[
        createEmptyMonth(),
        createEmptyMonth()
    ]
};

function createEmptyMonth(){
    return {
        monthly:{},
        monday:{},
        daily:{
            bugs:new Array(10).fill(false),
            journey:new Array(5).fill(false)
        }
    };
}

function currentState(){
    return state.months[activeMonth];
}

function init(){
    loadState();
    renderAll();
    updateTotals();
}

function renderAll(){
    renderMonthly();
    renderMonday();
    renderDaily();
    updateMonthButtons();
}

function renderMonthly(){
    const container = document.getElementById('monthly-list');
    container.innerHTML = '';

    tasks.monthly.forEach(task=>{
        const checked = currentState().monthly[task.id] || false;

        container.innerHTML += `
        <div class="task-item">
            <div>
                <div class="task-name">${task.name}</div>
                <div class="task-points">
                    Min: <span>${task.min}</span> | Max: <span>${task.max}</span>
                </div>
            </div>

            <label class="checkbox-wrapper">
                <input type="checkbox"
                       ${checked ? 'checked':''}
                       onchange="toggleMonthly('${task.id}', this.checked)">
                <span class="checkmark"></span>
            </label>
        </div>`;
    });
}

function renderMonday(){
    const container = document.getElementById('monday-list');
    container.innerHTML = '';

    tasks.monday.forEach(task=>{

        if(!currentState().monday[task.id]){
            currentState().monday[task.id] = {
                w1:false,w2:false,w3:false,w4:false
            };
        }

        const weeks = currentState().monday[task.id];

        container.innerHTML += `
        <div class="task-item">
            <div>
                <div class="task-name">${task.name}</div>
                <div class="task-points">
                    Min: <span>${task.min}</span> | Max: <span>${task.max}</span>
                </div>
            </div>

            <div class="weekly-checks">
                ${['w1','w2','w3','w4'].map((week,index)=>`
                    <div class="week-box">
                        <small>W${index+1}</small>

                        <label class="checkbox-wrapper">
                            <input type="checkbox"
                                ${weeks[week] ? 'checked':''}
                                onchange="toggleWeek('${task.id}','${week}',this.checked)">
                            <span class="checkmark"></span>
                        </label>
                    </div>
                `).join('')}
            </div>
        </div>`;
    });
}

function renderDaily(){

    const bugGrid = document.getElementById('bug-grid');
    bugGrid.innerHTML = '';

    currentState().daily.bugs.forEach((value,index)=>{
        bugGrid.innerHTML += `
        <div class="daily-item">
            <label class="checkbox-wrapper">
                <input type="checkbox"
                    ${value ? 'checked':''}
                    onchange="toggleDaily('bugs',${index})">
                <span class="checkmark"></span>
            </label>
            <small>#${index+1}</small>
        </div>`;
    });

    document.getElementById('bug-count').innerText =
        `${currentState().daily.bugs.filter(Boolean).length}/10`;

    const journeyGrid = document.getElementById('journey-grid');
    journeyGrid.innerHTML = '';

    currentState().daily.journey.forEach((value,index)=>{
        journeyGrid.innerHTML += `
        <div class="daily-item">
            <label class="checkbox-wrapper">
                <input type="checkbox"
                    ${value ? 'checked':''}
                    onchange="toggleDaily('journey',${index})">
                <span class="checkmark"></span>
            </label>
            <small>#${index+1}</small>
        </div>`;
    });

    document.getElementById('journey-count').innerText =
        `${currentState().daily.journey.filter(Boolean).length}/5`;
}

function toggleMonthly(id,checked){
    currentState().monthly[id] = checked;
    saveState();
    updateTotals();
}

function toggleWeek(taskId,week,checked){
    currentState().monday[taskId][week] = checked;
    saveState();
    updateTotals();
}

function toggleDaily(type,index){
    currentState().daily[type][index] =
        !currentState().daily[type][index];

    saveState();
    renderDaily();
    updateTotals();
}

function calculateMonth(monthData){

    let min = 0;
    let max = 0;

    tasks.monthly.forEach(task=>{
        if(monthData.monthly[task.id]){
            min += task.min;
            max += task.max;
        }
    });

    tasks.monday.forEach(task=>{
        const weeks = monthData.monday[task.id];

        if(weeks){
            const checked = Object.values(weeks).filter(Boolean).length;

            min += checked * task.min;
            max += checked * task.max;
        }
    });

    const bugs = monthData.daily.bugs.filter(Boolean).length;
    const journey = monthData.daily.journey.filter(Boolean).length;

    min += bugs * tasks.daily.bugs.min;
    max += bugs * tasks.daily.bugs.max;

    min += journey * tasks.daily.journey.min;
    max += journey * tasks.daily.journey.max;

    return {min,max};
}

function updateTotals(){

    const current = calculateMonth(currentState());

    document.getElementById('month-min').innerText = current.min;
    document.getElementById('month-max').innerText = current.max;

    let overallMin = 0;
    let overallMax = 0;

    state.months.forEach(month=>{
        const res = calculateMonth(month);
        overallMin += res.min;
        overallMax += res.max;
    });

    document.getElementById('overall-min').innerText = overallMin;
    document.getElementById('overall-max').innerText = overallMax;

    document.getElementById('grand-min').innerText = overallMin;
    document.getElementById('grand-max').innerText = overallMax;
}

function switchMonth(index){
    activeMonth = index;
    renderAll();
    updateTotals();
}

function updateMonthButtons(){
    document.querySelectorAll('.month-btn').forEach((btn,index)=>{
        btn.classList.toggle('active', index === activeMonth);
    });
}

function saveState(){
    localStorage.setItem('HQ_ELITE_TRACKER', JSON.stringify(state));
}

function loadState(){
    const saved = localStorage.getItem('HQ_ELITE_TRACKER');

    if(saved){
        state = JSON.parse(saved);
    }

    if(!state.months || state.months.length !== 2){
        state.months = [
            createEmptyMonth(),
            createEmptyMonth()
        ];
    }
}

function resetMonth(index){
    if(confirm(`Reset Month ${index + 1} progress?`)){
        state.months[index] = createEmptyMonth();
        saveState();
        renderAll();
        updateTotals();
    }
}

function resetAll(){
    if(confirm('Reset all 2-month progress?')){
        localStorage.removeItem('HQ_ELITE_TRACKER');
        location.reload();
    }
}

init();
</script>

</body>
</html>
